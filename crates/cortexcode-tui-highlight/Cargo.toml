[package]
name = "cortexcode-tui-highlight"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Syntax highlighting for the cortex TUI: a port of highlight.js 10.7.3 over its own grammars"
readme = "README.md"

[package.metadata.cortex]
publish = true

[lib]
# This crate has no doctests; skip the rustdoc test build (build-speed D4).
doctest = false

[dependencies]
cortexcode-tui-util = { workspace = true }
once_cell = "1"
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
serde_json = "1"
