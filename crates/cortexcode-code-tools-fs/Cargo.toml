[package]
name = "cortexcode-code-tools-fs"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "File tools for the cortex coding agent: read (with read-dedup)"
readme = "README.md"

[package.metadata.cortex]
publish = false

[lib]
# This crate has no doctests; skip the rustdoc test build (build-speed D4).
doctest = false

[dependencies]
cortexcode-agent-types = { workspace = true }
cortexcode-ai-types = { workspace = true }
cortexcode-code-media = { workspace = true }
cortexcode-code-tool-api = { workspace = true }
base64 = "0.22"
regex = "1"
regex-lite = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1_smol = "1"
unicode-normalization = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
