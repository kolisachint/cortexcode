[package]
name = "cortexcode-ai-oauth-google"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Google Cloud Code Assist OAuth flows (Gemini CLI, Antigravity) for cortex AI"
readme = "README.md"

[package.metadata.cortex]
publish = false

[dependencies]
cortexcode-ai-oauth = { workspace = true }
serde_json = "1"
tokio = { version = "1", features = ["macros", "time"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync"] }
