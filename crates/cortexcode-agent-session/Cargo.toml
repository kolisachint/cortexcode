[package]
name = "cortexcode-agent-session"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Session trees for cortex agents: entry format, storage, repositories"
readme = "README.md"

[package.metadata.cortex]
publish = true

[lib]
# This crate has no doctests; skip the rustdoc test build (build-speed D4).
doctest = false

[dependencies]
cortexcode-agent-types = { workspace = true }
cortexcode-ai-types = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4", "v7"] }
