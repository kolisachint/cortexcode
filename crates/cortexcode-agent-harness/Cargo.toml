[package]
name = "cortexcode-agent-harness"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Agent harness for cortex agents"
readme = "README.md"

[package.metadata.cortex]
publish = true

[dependencies]
cortexcode-agent-types = { workspace = true }
cortexcode-ai-types = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
regex = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["fs", "process", "io-util", "time", "macros", "rt"] }
futures-util = { version = "0.3", default-features = false }
ignore = "0.4"
serde_yaml_ng = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "time"] }
