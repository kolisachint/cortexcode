[package]
name = "cortexcode-code-agent-session"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "AgentSession: the agent lifecycle shared by the cortex run modes"
readme = "README.md"

[package.metadata.cortex]
publish = false

[dependencies]
cortexcode-agent-compaction = { workspace = true }
cortexcode-agent-core = { workspace = true }
cortexcode-agent-harness = { workspace = true }
cortexcode-agent-types = { workspace = true }
cortexcode-ai-models = { workspace = true }
cortexcode-ai-registry = { workspace = true }
cortexcode-ai-types = { workspace = true }
cortexcode-code-models = { workspace = true }
cortexcode-code-paths = { workspace = true }
cortexcode-code-prompts = { workspace = true }
cortexcode-code-session = { workspace = true }
cortexcode-code-settings = { workspace = true }
cortexcode-code-tool-api = { workspace = true }
cortexcode-code-tool-bash = { workspace = true }
cortexcode-code-tools = { workspace = true }
cortexcode-code-tools-fs = { workspace = true }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
cortexcode-ai-provider-faux = { workspace = true }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
