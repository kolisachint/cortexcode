[package]
name = "cortexcode-code-subagents"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Subagent orchestration for the cortex coding agent"
readme = "README.md"

[package.metadata.cortex]
publish = true

[dependencies]
cortexcode-agent-types = { workspace = true }
cortexcode-ai-types = { workspace = true }
cortexcode-code-agent-session = { workspace = true }
cortexcode-code-paths = { workspace = true }
cortexcode-code-resources = { workspace = true }
cortexcode-code-rpc = { workspace = true }
cortexcode-code-session = { workspace = true }
cortexcode-code-settings = { workspace = true }
cortexcode-code-task-store = { workspace = true }
cortexcode-code-tool-api = { workspace = true }
chrono = "0.4"
regex = "1"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "process", "io-util", "sync", "time", "macros"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
cortexcode-code-paths = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
