[package]
name = "cortexcode-code-tool-bash"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The bash tool for the cortex coding agent: shell resolution, process-tree kill, streamed and truncated output"
readme = "README.md"

[package.metadata.cortex]
publish = false

[dependencies]
cortexcode-agent-harness = { workspace = true }
cortexcode-agent-types = { workspace = true }
cortexcode-ai-types = { workspace = true }
cortexcode-code-paths = { workspace = true }
cortexcode-code-tool-api = { workspace = true }
process-wrap = { version = "10", default-features = false, features = ["std", "process-group", "job-object"] }
regex-lite = "0.1"
serde_json = "1"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
