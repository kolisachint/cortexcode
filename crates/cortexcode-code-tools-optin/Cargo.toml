[package]
name = "cortexcode-code-tools-optin"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Opt-in tools for the cortex coding agent: TodoWrite and ask_options"
readme = "README.md"

[package.metadata.cortex]
publish = false

[lib]
# This crate has no doctests; skip the rustdoc test build (build-speed D4).
doctest = false

[dependencies]
cortexcode-agent-types = { workspace = true }
cortexcode-ai-types = { workspace = true }
cortexcode-code-task-store = { workspace = true }
cortexcode-code-tool-api = { workspace = true }
serde_json = { version = "1", features = ["preserve_order"] }
