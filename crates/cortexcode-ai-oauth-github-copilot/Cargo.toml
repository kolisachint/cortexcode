[package]
name = "cortexcode-ai-oauth-github-copilot"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "GitHub Copilot OAuth device flow for cortex AI"
readme = "README.md"

[package.metadata.cortex]
publish = false

[dependencies]
cortexcode-ai-models = { workspace = true }
cortexcode-ai-oauth = { workspace = true }
cortexcode-ai-types = { workspace = true }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "macros"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
