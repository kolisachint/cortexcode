[package]
name = "cortexcode-code-tui-app"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The coding agent's interactive mode on the cortex TUI"
readme = "README.md"

[package.metadata.cortex]
publish = false

[lib]
# This crate has no doctests; skip the rustdoc test build (build-speed D4).
doctest = false

[dependencies]
libc = "0.2"
cortexcode-agent-types = { workspace = true }
cortexcode-agent-compaction = { workspace = true }
cortexcode-code-agent-session = { workspace = true }
cortexcode-code-auth = { workspace = true }
cortexcode-ai-oauth = { workspace = true }
cortexcode-code-models = { workspace = true }
cortexcode-code-tools = { workspace = true }
cortexcode-code-tool-api = { workspace = true }
cortexcode-code-media = { workspace = true }
cortexcode-ai-util = { workspace = true }
cortexcode-code-tool-bash = { workspace = true }
cortexcode-tui-images = { workspace = true }
cortexcode-code-paths = { workspace = true }
cortexcode-code-permissions = { workspace = true }
cortexcode-code-resources = { workspace = true }
cortexcode-code-subagents = { workspace = true }
cortexcode-code-session = { workspace = true }
cortexcode-code-settings = { workspace = true }
cortexcode-code-task-store = { workspace = true }
cortexcode-code-tui-keybindings = { workspace = true }
cortexcode-code-tools-optin = { workspace = true }
cortexcode-code-tui-selectors = { workspace = true }
cortexcode-code-tui-theme = { workspace = true }
cortexcode-code-tui-widgets = { workspace = true }
cortexcode-ai-types = { workspace = true }
cortexcode-tui-components = { workspace = true }
cortexcode-tui-fuzzy = { workspace = true }
cortexcode-tui-keys = { workspace = true }
cortexcode-tui-render = { workspace = true }
cortexcode-tui-terminal = { workspace = true }
cortexcode-tui-util = { workspace = true }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt", "sync"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
# The native clipboard (clipboard-native.ts): text off Linux, images where
# no Wayland/WSL tool answers.
arboard = { version = "3", default-features = false, features = ["image-data"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
