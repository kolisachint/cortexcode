[package]
name = "cortexcode-ai-provider-anthropic"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Anthropic provider for cortex AI"
readme = "README.md"

[package.metadata.cortex]
publish = true

[dependencies]
cortexcode-ai-env = { workspace = true }
cortexcode-ai-models = { workspace = true }
cortexcode-ai-types = { workspace = true }
cortexcode-ai-stream = { workspace = true }
cortexcode-ai-util = { workspace = true }
serde_json = "1"
futures-util = { version = "0.3", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio = { version = "1", features = ["macros"] }

[dev-dependencies]
cortexcode-ai-stream = { workspace = true, features = ["testing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
