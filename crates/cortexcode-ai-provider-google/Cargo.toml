[package]
name = "cortexcode-ai-provider-google"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Google Gemini provider for cortex AI"
readme = "README.md"

[package.metadata.cortex]
publish = true

[dependencies]
cortexcode-ai-types = { workspace = true }
cortexcode-ai-sse = { workspace = true }
cortexcode-ai-stream = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = { version = "0.3", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio = { version = "1", features = ["macros"] }
jsonwebtoken = "9"
base64 = "0.21"

[dev-dependencies]
cortexcode-ai-stream = { workspace = true, features = ["testing"] }
tokio = { version = "1", features = ["rt", "macros"] }
