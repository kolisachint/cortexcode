[package]
name = "cortexcode-ai-provider-azure"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Azure OpenAI provider for cortex AI"
readme = "README.md"

[package.metadata.cortex]
publish = true

[lib]
# This crate has no doctests; skip the rustdoc test build (build-speed D4).
doctest = false

[dependencies]
cortexcode-ai-provider-openai-responses = { workspace = true }
cortexcode-ai-stream = { workspace = true }
cortexcode-ai-types = { workspace = true }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }

[dev-dependencies]
cortexcode-ai-models = { workspace = true }
cortexcode-ai-stream = { workspace = true, features = ["testing"] }
