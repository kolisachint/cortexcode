[package]
name = "cortexcode-ai-provider-openai-responses"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "OpenAI Responses API provider for cortex AI, and the Responses plumbing shared with Azure"
readme = "README.md"

[package.metadata.cortex]
publish = false

[dependencies]
cortexcode-ai-env = { workspace = true }
cortexcode-ai-models = { workspace = true }
cortexcode-ai-sse = { workspace = true }
cortexcode-ai-stream = { workspace = true }
cortexcode-ai-types = { workspace = true }
cortexcode-ai-util = { workspace = true }
serde_json = "1"
futures-util = { version = "0.3", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio = { version = "1", features = ["macros"] }

[dev-dependencies]
cortexcode-ai-stream = { workspace = true, features = ["testing"] }
