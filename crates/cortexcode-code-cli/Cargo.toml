[package]
name = "cortexcode-code-cli"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "CLI argument parsing and mode dispatch for the cortex coding agent (port of hoocode cli/args.ts + main.ts)"
readme = "README.md"

[package.metadata.cortex]
publish = false

[lib]
# This crate has no doctests; skip the rustdoc test build (build-speed D4).
doctest = false

[dependencies]
cortexcode-ai-util = { workspace = true }
cortexcode-app-server = { workspace = true }
cortexcode-code-agent-session = { workspace = true }
cortexcode-code-print = { workspace = true }
cortexcode-code-session = { workspace = true }
cortexcode-code-paths = { workspace = true }
cortexcode-code-settings = { workspace = true }
cortexcode-code-models = { workspace = true }
cortexcode-code-auth = { workspace = true }
cortexcode-code-resources = { workspace = true }
cortexcode-code-modes = { workspace = true }
cortexcode-code-permissions = { workspace = true }
cortexcode-tui-fuzzy = { workspace = true }
cortexcode-ai-registry = { workspace = true }
cortexcode-code-prompts = { workspace = true }
cortexcode-code-rpc = { workspace = true }
cortexcode-code-subagents = { workspace = true }
cortexcode-code-task-store = { workspace = true }
cortexcode-code-media = { workspace = true }
base64 = "0.22"
cortexcode-code-tool-api = { workspace = true }
cortexcode-code-tools = { workspace = true }
cortexcode-code-tools-fs = { workspace = true }
cortexcode-code-tool-bash = { workspace = true }
cortexcode-code-tools-optin = { workspace = true }
cortexcode-ai-env = { workspace = true }
cortexcode-ai-oauth = { workspace = true }
cortexcode-ai-oauth-anthropic = { workspace = true }
cortexcode-ai-oauth-github-copilot = { workspace = true }
cortexcode-ai-oauth-google = { workspace = true }
cortexcode-ai-oauth-openai-codex = { workspace = true }
cortexcode-ai-stream = { workspace = true }
cortexcode-ai-types = { workspace = true }
cortexcode-agent-core = { workspace = true }
cortexcode-agent-compaction = { workspace = true }
cortexcode-agent-types = { workspace = true }
cortexcode-code-tui-app = { workspace = true }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "io-std"] }
url = "2"

[dev-dependencies]
cortexcode-tui-terminal = { workspace = true }
cortexcode-tui-util = { workspace = true }
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
