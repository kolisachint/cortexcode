[package]
name = "cortexcode-code-rpc"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "RPC mode for the cortex coding agent"
readme = "README.md"

[package.metadata.cortex]
publish = true

[dependencies]
cortexcode-ai-types = { workspace = true }
cortexcode-code-agent-session = { workspace = true }
cortexcode-code-settings = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "io-util", "sync", "macros", "process", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
cortexcode-agent-core = { workspace = true }
cortexcode-agent-harness = { workspace = true }
cortexcode-agent-types = { workspace = true }
cortexcode-ai-provider-faux = { workspace = true }
cortexcode-code-models = { workspace = true }
cortexcode-code-session = { workspace = true }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
