[package]
name = "cortexcode-code-auth"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Credential storage for the cortex coding agent: auth.json API keys and OAuth tokens with locked refresh"
readme = "README.md"

[package.metadata.cortex]
publish = false

[dependencies]
cortexcode-ai-types = { workspace = true }
cortexcode-ai-env = { workspace = true }
cortexcode-ai-oauth = { workspace = true }
cortexcode-code-models = { workspace = true }
cortexcode-code-paths = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }
rand = "0.8"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
