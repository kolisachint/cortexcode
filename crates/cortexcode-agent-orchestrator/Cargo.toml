[package]
name = "cortexcode-agent-orchestrator"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "AgentHarness: the headless agent orchestrator (agent + session + compaction) for cortex"
readme = "README.md"

[package.metadata.cortex]
publish = false

[dependencies]
cortexcode-agent-compaction = { workspace = true }
cortexcode-agent-core = { workspace = true }
cortexcode-agent-harness = { workspace = true }
cortexcode-agent-session = { workspace = true }
cortexcode-agent-types = { workspace = true }
cortexcode-ai-registry = { workspace = true }
cortexcode-ai-types = { workspace = true }
serde_json = "1"

[dev-dependencies]
cortexcode-ai-models = { workspace = true }
cortexcode-ai-provider-faux = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
