[package]
name = "cortexcode-ai-provider-openai-codex"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "OpenAI Codex (ChatGPT subscription) Responses provider for cortex AI: SSE and WebSocket transports"
readme = "README.md"

[package.metadata.cortex]
publish = false

[dependencies]
cortexcode-ai-env = { workspace = true }
cortexcode-ai-models = { workspace = true }
cortexcode-ai-provider-openai-responses = { workspace = true }
cortexcode-ai-stream = { workspace = true }
cortexcode-ai-types = { workspace = true }
cortexcode-ai-util = { workspace = true }
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "time", "sync", "net"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util", "time", "net", "io-util"] }
