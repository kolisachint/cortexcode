[package]
name = "cortexcode-code-tool-api"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Shared tool plumbing for the cortex coding agent: tool definitions, output truncation, path resolution"
