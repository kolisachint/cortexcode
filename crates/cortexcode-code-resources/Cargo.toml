[package]
name = "cortexcode-code-resources"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Resources for the cortex coding agent: skills, prompt templates, slash commands, agent definitions, context files"
readme = "README.md"

[package.metadata.cortex]
publish = false

[dependencies]
cortexcode-agent-harness = { workspace = true }
cortexcode-code-paths = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
dirs = "5"
glob = "0.3"
sha2 = "0.10"
cortexcode-code-settings = { workspace = true }

[dev-dependencies]
tempfile = "3"
