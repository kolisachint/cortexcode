name: CI

# Parallel gates (docs/design/build-speed.md §4.2). Also called by release.yml,
# so a release runs exactly these checks, side by side, before it tags.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  # github.workflow is the caller's name under workflow_call, so a release never
  # cancels (or is cancelled by) the CI run of the same push.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Pinned hoocode fixtures
        run: scripts/ci/fetch_hoocode_fixtures.sh
      - run: cargo nextest run --locked --workspace --no-fail-fast
        # The only crate with a doctest (build-speed D4: the rest set doctest = false).
      - run: cargo test --locked --doc -p cortexcode-agent-mcp

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: doc
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --locked --workspace --no-deps

  test-layout:
    # Guard for build-speed D3: integration tests live in crates/*/tests/it/
    # (one `it` binary per crate), not as one binary per file.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          stray=$(find crates -path '*/tests/*.rs' -not -path '*/tests/it/*')
          if [ -n "$stray" ]; then
            echo "integration tests must live under tests/it/:"
            echo "$stray"
            exit 1
          fi

  firewall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 migration/check_dep_firewall.py
      # The curl installer runs under any /bin/sh; check it parses under dash too.
      - name: install.sh syntax
        run: |
          sudo apt-get install -y -qq dash >/dev/null
          sh -n install/install.sh
          dash -n install/install.sh
