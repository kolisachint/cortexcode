name: Release

# Fast path: CI gates (parallel, via ci.yml) → bump + tag + GitHub release →
# binaries for 4 targets in parallel (binaries.yml). crates.io publishing is
# opt-in (publish_crates) and runs beside the binaries, never in front of them.

on:
  workflow_dispatch:
    inputs:
      level:
        description: "Version bump level"
        required: true
        type: choice
        options: [patch, minor, major]
      skip_gates:
        description: "Skip CI gates (the commit is already green on main)"
        type: boolean
        default: false
      publish_crates:
        description: "Also publish crates to crates.io"
        type: boolean
        default: false
  workflow_call:
    inputs:
      level:
        required: true
        type: string
      skip_gates:
        type: boolean
        default: false
      publish_crates:
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gates:
    if: ${{ !inputs.skip_gates }}
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  tag:
    needs: gates
    # Run after green gates, or straight away when they were skipped.
    if: ${{ !cancelled() && (needs.gates.result == 'success' || needs.gates.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Bump versions
        id: bump
        run: |
          version=$(python3 scripts/bump_versions.py "${{ inputs.level }}" | tail -1)
          # Keep Cargo.lock in step with the bumped version (workspace members only),
          # so the --locked builds downstream accept it.
          cargo update --workspace
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Commit, tag, push
        run: |
          tag="${{ steps.bump.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "Release $tag"
          git tag "$tag"
          git push origin HEAD:main "$tag"
      - name: GitHub release
        # Created before the binaries so each target uploads as soon as it is built.
        run: gh release create "${{ steps.bump.outputs.tag }}" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  binaries:
    needs: tag
    if: ${{ !cancelled() && needs.tag.result == 'success' }}
    uses: ./.github/workflows/binaries.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    permissions:
      contents: write

  crates:
    needs: tag
    if: ${{ !cancelled() && needs.tag.result == 'success' && inputs.publish_crates }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - name: Toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Publish to crates.io
        run: python3 scripts/publish_packages.py
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
          CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
