name: Build binaries

# Release binaries, shipped as `hoocode` (the Rust build; the crate's binary is
# `cortex`) plus the `hoocode-ts` shim that runs the TypeScript hoocode.

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      upload:
        description: "Attach the archives to the release named by tag"
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to build (e.g. v0.1.0)"
        required: true
        type: string
  release:
    # Releases made by hand. Releases made by release.yml (GITHUB_TOKEN) do not
    # fire this event; release.yml calls this workflow directly instead.
    types: [published]

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds link musl statically, so one binary runs on any distro.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Toolchain (rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - name: musl toolchain (Linux)
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
          # C deps (ring, zstd-sys) must be built with the musl compiler too.
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
        env:
          TARGET: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build binary
        run: cargo build --locked --release --target ${{ matrix.target }} --bin cortex

      - name: Smoke test
        # x86_64-apple-darwin is cross-built on an arm64 runner; skip running it.
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/cortex"
          [[ -f "$bin.exe" ]] && bin="$bin.exe"
          "$bin" --version
          if [[ "${{ matrix.target }}" == *musl ]]; then
            file "$bin"
            file "$bin" | grep -Eq 'static(ally|-pie) linked' || { echo "not statically linked" >&2; exit 1; }
          fi

      - name: Package
        id: pkg
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          name="hoocode-$TARGET"
          mkdir -p "dist/$name"
          cp README.md LICENSE "dist/$name/"
          if [[ "$TARGET" == *windows* ]]; then
            cp "target/$TARGET/release/cortex.exe" "dist/$name/hoocode.exe"
            cp scripts/shims/hoocode-ts.cmd "dist/$name/"
            (cd dist && 7z a "$name.zip" "$name" >/dev/null)
            echo "file=dist/$name.zip" >> "$GITHUB_OUTPUT"
          else
            cp "target/$TARGET/release/cortex" "dist/$name/hoocode"
            cp scripts/shims/hoocode-ts "dist/$name/"
            chmod +x "dist/$name/hoocode" "dist/$name/hoocode-ts"
            tar czf "dist/$name.tar.gz" -C dist "$name"
            echo "file=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to release
        # Under workflow_call, event_name is the caller's, so the input decides.
        if: github.event_name == 'release' || inputs.upload
        shell: bash
        run: gh release upload "$TAG" "${{ steps.pkg.outputs.file }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        if: github.event_name != 'release' && !inputs.upload
        uses: actions/upload-artifact@v4
        with:
          name: hoocode-${{ matrix.target }}
          path: ${{ steps.pkg.outputs.file }}

  checksums:
    # One SHA256SUMS file covering every archive, for installers to verify.
    needs: build
    if: ${{ !cancelled() && (github.event_name == 'release' || inputs.upload) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir sums && cd sums
          gh release download "$TAG" --pattern 'hoocode-*'
          sha256sum hoocode-* | tee SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber
