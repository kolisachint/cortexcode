name: TUI parity (level 2)

# Runs the rendered-TUI comparison of pinned hoocode vs cortex. Manual and nightly;
# failures are expected until the owning ledger tasks land, so this does not gate PRs.
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Scenario name or 'all'"
        default: all
  schedule:
    - cron: "17 3 * * *"

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Build pinned hoocode reference
        run: migration/tui-parity/setup_hoocode.sh
      - name: Build cortex
        run: cargo build -p cortexcode-code-main --bin cortex
      - name: Run scenarios
        run: python3 migration/tui-parity/harness.py run "${{ inputs.scenario || 'all' }}" || true
      - name: Summary
        run: cat target/tui-parity/summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: tui-parity-reports
          path: target/tui-parity/
